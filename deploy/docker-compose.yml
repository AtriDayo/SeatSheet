services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: seatsheet
      POSTGRES_USER: seatsheet
      POSTGRES_PASSWORD: seatsheet_change_me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://seatsheet:seatsheet_change_me@postgres:5432/seatsheet?schema=public
      PORT: 3000
      CORS_ORIGIN: https://seats.atridayo.com,https://seats-config.atridayo.com

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
